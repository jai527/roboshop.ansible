## ansible-playbook -i localhost, -e '{"instances":["mongodb","catalogue","redis","user","cart",mysql","shipping","rabbitmq","payment","frontend"]}' roboshop.yaml


- name: create ec2 and r53 records
  hosts: localhost
  connection: local

  vars:
    sg_id: "sg-02677d7f13c97966d"
    ami_id: "ami-0220d79f3f480ecf5"
    domain_name: "jai01.online"
    env: dev
    action: create   # IMPORTANT

  tasks:

    - name: create ec2 instances
      amazon.aws.ec2_instance:
        name: "{{ item }}-{{ env }}"
        instance_type: t3.micro
        image_id: "{{ ami_id }}"
        security_group: "{{ sg_id }}"
        tags:
          project: roboshop
          Component: "{{ item }}"
          Environment: "{{ env }}"
          Name: "{{ item }}-{{ env }}"
      loop: "{{ instances }}"
      register: ec2_output
      when: action == "create"

    - name: print ec2 output
      ansible.builtin.debug:
        var: ec2_output
      when: action == "create"

    - name: create private route53 records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}-{{ env }}.{{ domain_name }}"
        type: A
        ttl: 300
        value: "{{ item.instances[0].private_ip_address }}"
        wait: true
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: action == "create"

    - name: create public route53 record for frontend
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "roboshop-{{ env }}.{{ domain_name }}"
        type: A
        ttl: 300
        value: "{{ item.instances[0].public_ip_address }}"
        wait: true
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when:
        - action == "create"
        - item.item == "frontend"

    ###################################
    # DESTROY SECTION
    ###################################

    - name: delete r53 records
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ item }}-{{ env }}.{{ domain_name }}"
        type: A
      loop: "{{ instances }}"
      when: action == "destroy"
    
    - name: delete ec2 instances
      amazon.aws.ec2_instance:
        state: absent
        name: "{{ item }}-{{ env }}"
        wait: false
      loop: "{{ instances }}"
      when: action == "destroy"