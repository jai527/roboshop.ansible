## ansible-playbook -i localhost, -e '{"instances":["mongodb","catalogue","redis","user","cart",mysql","shipping","rabbitmq","payment","frontend"]}' roboshop.yaml

- name: create ec2 and r53 records
  hosts: localhost
  connection: local

  vars:
    sg_id: "sg-02677d7f13c97966d"
    ami_id: "ami-0220d79f3f480ecf5"
    domain_name: jai01.online
    env: dev

  tasks:

    - name: create ec2 instances
      amazon.aws.ec2_instance:
        name: "{{ item }}-{{ env }}"
        instance_type: t3.micro
        image_id: "{{ ami_id }}"
        security_group: "{{ sg_id }}"
        tags:
          project: roboshop
          Component: "{{ item }}"
          Environment: "{{ env }}"
          Name: "{{ item }}-{{ env }}"
      loop: "{{ instances }}"
      register: ec2_output

    - name: print ec2 output
      ansible.builtin.debug:
        var: ec2_output

    - name: create private route53 records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}-{{ env }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        wait: true
        overwrite: true
      loop: "{{ ec2_output.results }}"

    - name: create public route53 record for frontend
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "roboshop-{{ env }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        wait: true
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: item.item == "frontend"