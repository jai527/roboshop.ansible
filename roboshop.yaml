- name: create ec2 and r53 records
  hosts: localhost
  connection: localhost
  vars:
    sg_id:  "sg-02677d7f13c97966d"
    ami_id: "ami-0220d79f3f480ecf5"
    #domain_name: jai01.online
    env: dev
    instance:
    - mongodb
    - catalogue
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      instance_type: "t3.micro"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      name: "{{ item }}-{{ env }}"
      tags:
        project: roboshop
        Component: "{{ item }}"
        Environment: "{{ env }}"
        Name: "{{ item }}-{{ env }}"
    loop: "{{ instance }}"
    register: ec2_output

  - name: print the out put
    ansible.builtin.debug:
      msg: "{{ ec2_output }}" 
  
