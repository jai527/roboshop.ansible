- name: instal cart
  become: yes
  hosts: cart

  tasks:
    - name: disable old nodejs 
      ansible.builtin.command: dnf module disable nodejs -yaml
    
    - name: enable latest nodejs
      ansible.builtin.command: dnf module enable nodejs:20 -y
    
    - name: install nodejs
      ansible.builtin.dnf:
        name: nodejs
        state: prasent

    - name: create system user
      ansible.builtin.user:
        name: roboshop
        path: /app
        shell:  /sbin/nologin
        comment: "system user"
    
    - name: delete old app directory
      ansible.builtin.file:
      path: /app
      state: absent
    
    - name: create app directory
      ansible.builtin.file:
      path: /app
      state: prasent
    
    - name: download the application
      ansible.builtin.get_url:
      path: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
      dest: /tmp/cart.zip

    - name: unzip user application
      ansible.builtin.unarchive:
        src: /tmp/user.zip
        dest: /app
        remote_src: yes

    - name: install dependencies
      community.general.npm:
        path: /app
    
    - name: copy the cart service
      ansible.builtin.copy:
      src: cart.service
      dest: /etc/systemd/system/cart.service
     
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: start user service
      ansible.builtin.service:
        name: user
        state: started
        enabled: yes


    
  