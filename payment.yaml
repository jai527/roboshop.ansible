- name: configure the payment server
  become: yes
  hosts: payment

  tasks:

    - name: install python and dependencies
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop:
        - python3
        - gcc
        - python3-devel

    - name: create system user
      ansible.builtin.user:
        name: roboshop
        system: true
        home: /app
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: delete old app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: create app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: delete old zip file
      ansible.builtin.file:
        path: /tmp/payment.zip
        state: absent

    - name: download payment application
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
        dest: /tmp/payment.zip

    - name: unzip application
      ansible.builtin.unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes

    - name: install python dependencies
      ansible.builtin.pip:
        requirements: requirements.txt
        executable: pip3
      args:
        chdir: /app

    - name: copy payment service
      ansible.builtin.copy:
        src: payment.service
        dest: /etc/systemd/system/payment.service

    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: start and enable payment service
      ansible.builtin.service:
        name: payment
        state: restarted
        enabled: yes